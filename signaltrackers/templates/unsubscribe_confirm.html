{% extends "base.html" %}

{% block title %}Unsubscribe - MacroClarity{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-body text-center py-5">
                    <div class="mb-4">
                        <i class="bi bi-envelope-x text-muted" style="font-size: 4rem;"></i>
                    </div>
                    <h1 class="h3 mb-3">Unsubscribe from {{ email_type }} emails?</h1>
                    <p class="text-muted mb-4">
                        You will stop receiving {{ email_type }} emails from MacroClarity. Other emails are not affected.
                    </p>
                    <form method="post">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Unsubscribe
                        </button>
                    </form>
                    <div class="mt-3">
                        <a href="/" class="d-inline-flex align-items-center px-2" style="min-height: 44px;">Return to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
